name: solar_partner
description: "Solar Partner - connecting installers, shopkeepers, and brands in the solar energy ecosystem."
publish_to: 'none'

version: 1.0.3+3

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  intl: ^0.19.0
  shimmer: ^3.0.0
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  carousel_slider: ^5.0.0
  dio: ^5.4.0
  get_storage: ^2.1.1
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  geolocator: ^13.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
